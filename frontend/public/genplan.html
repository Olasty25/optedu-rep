<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Generator</title>
  <style>
     <link rel="stylesheet" href="style.css">
  </style>
</head>
<body>
  <header>
    <h1>Generate Your Plan</h1>
  </header>

  <div class="container">
    <!-- Start screen -->
    <div id="startScreen">
      <button class="btn" onclick="showSection('sources')">Use your own sources</button>
      <button class="btn primary" onclick="showSection('structure')">Define plan structure</button>
    </div>

    <!-- Use Your Own Sources -->
    <div id="sources" class="hidden">
      <h2>Use Your Own Sources</h2>
      <input type="text" placeholder="Paste a URL">
      <label>Or upload files:</label>
      <input type="file" multiple>
      <button class="btn primary" onclick="backToStart()">Back</button>
    </div>

    <!-- Define Plan Structure (pager) -->
    <div id="structure" class="hidden">
      <form id="pagerForm">
        <!-- Page 1 -->
        <div class="form-step active">
          <label>Title</label>
          <input type="text" placeholder="e.g. French revolution">
          <label>Description</label>
          <input type="text" placeholder="e.g. 3rd chapter, only key info">
        </div>
        <!-- Page 2 -->
        <div class="form-step hidden">
          <label>What do you want to achieve?</label>
          <input type="text" placeholder="e.g. Be prepared for exam">
          <label>How much time you got?</label>
          <input type="text" placeholder="e.g. 6 days">
          <label>How much time can you study daily?</label>
          <input type="text" placeholder="e.g. 20 mins">
        </div>
        <!-- Page 3 -->
        <div class="form-step hidden">
          <label>Would you like AI reminders?</label>
          <div class="options">
            <label><input type="radio" name="reminders"> Yes</label>
            <label><input type="radio" name="reminders"> No</label>
          </div>
          <label>How confident do you feel about this topic right now?</label>
          <div class="options">
            <label><input type="radio" name="confidence"> Know nothing</label>
            <label><input type="radio" name="confidence"> Basics</label>
            <label><input type="radio" name="confidence"> Need review</label>
            <label><input type="radio" name="confidence"> Not sure</label>
          </div>
        </div>

        <!-- Pager buttons -->
        <div class="pager-buttons">
          <button type="button" id="prevBtn">Previous</button>
          <button type="button" id="nextBtn" class="primary">Next</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    © 2026 by ThoReSt | Privacy Policy
  </footer>

  <script>
    function showSection(id) {
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("sources").classList.add("hidden");
      document.getElementById("structure").classList.add("hidden");
      document.getElementById(id).classList.remove("hidden");
    }
    function backToStart() {
      document.getElementById("sources").classList.add("hidden");
      document.getElementById("structure").classList.add("hidden");
      document.getElementById("startScreen").classList.remove("hidden");
    }

    const steps = document.querySelectorAll(".form-step");
    let currentStep = 0;
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function showStep(index) {
      steps.forEach((s, i) => {
        s.classList.toggle("hidden", i !== index);
      });
      prevBtn.style.display = index === 0 ? "none" : "inline-block";
      nextBtn.textContent = index === steps.length - 1 ? "Save" : "Next";
    }

    prevBtn.addEventListener("click", () => {
      if (currentStep > 0) { currentStep--; showStep(currentStep); }
    });
    nextBtn.addEventListener("click", () => {
      if (currentStep < steps.length - 1) {
        currentStep++; showStep(currentStep);
      } else {
        alert("Plan saved!");
        backToStart();
      }
    });

    showStep(currentStep);
  </script>
</body>
</html>
