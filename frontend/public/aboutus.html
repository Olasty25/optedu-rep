<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us - Optedu AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
    }

    header {
      text-align: center;
      padding: 50px 20px 30px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      font-size: 28px;
      margin: 0;
    }

    .team {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }

    .member {
      border: 1px solid #ccc;
      padding: 20px;
      background: #fff;
    }

    .image-placeholder {
      width: 120px;
      height: 120px;
      border: 1px dashed #aaa;
      background: #f5f5f5;
      margin: 0 auto 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #555;
      font-size: 12px;
      border-radius: 50%; /* żeby przypominało awatar */
    }

    .member h3 {
      margin: 10px 0 5px;
      font-size: 16px;
    }

    .member p {
      font-size: 14px;
      color: #555;
      margin: 0;
    }

    footer {
      border-top: 1px solid #ddd;
      padding: 20px 40px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      color: #555;
    }

    footer a {
      color: #111;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>About Us</h1>
  </header>

  <!-- Team Section -->
  <div class="team">
    <div class="member">
      <div class="image-placeholder">[ Image ]</div>
      <h3>Aleksander Tomczak</h3>
      <p>IT passionate and nice and kind friend</p>
    </div>
    <div class="member">
      <div class="image-placeholder">[ Image ]</div>
      <h3>Mateusz Wrzyszcz</h3>
      <p>Creator and a backup</p>
    </div>
  </div>

  <!-- Footer (styl jak w Generate New Plan UI) -->
  <footer>
    <p>2026 by ThoReSt</p>
    <p href="#">Privacy Policy</p>
  </footer>

</body>
</html>
